[package]
name = "buntrail-ffi"
version = "0.2.0"
edition = "2024"
rust-version = "1.99.1"
description = "Native C ABI for the Buntrail engine."
license = "MIT"
repository = "https://github.com/buntrail/buntrail-ffi"
homepage = "https://github.com/buntrail"
documentation = "https://docs.rs/buntrail-ffi"
readme = "README.md"
authors = ["Bunga Mungil <bungamungil@icloud.com>"]

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
buntrail-core = "0.2.0"
buntrail-engine = "0.2.0"
serde_json = "=1.0.154"

[build-dependencies]
cbindgen = "=0.29.4"
